# Per-app hide rules. Written by the WebUI only after you apply your drafts;
# editing it by hand works too, but the WebUI backs up its own drafts
# separately and never rewrites this file on save.
#
#   app <userId> <packageName> <enabled 0|1> <filterDirectory 0|1>
#   path <absolute path>
#
# "path" lines belong to the preceding "app" line. Paths must be non-root
# absolute paths of at most 255 UTF-8 bytes, without commas or semicolons.
# Only enabled apps with at least one path are installed. These rules are independent of
# target_path.conf / scope_mode.conf and never inherit the legacy paths.
#
# Example:
#   app 0 com.example.reader 1 1
#   path /data/local/tmp/example.txt
