name: Build PathMask KernelSU Module (DDK)

on:
  workflow_call:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260828'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  build-pathmask:
    name: Build pathmask for ${{ inputs.kmi }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v6

    - name: Build pathmask.ko
      run: |
        cd kernel

        sh scripts/fetch-deps.sh

        echo "=== Building pathmask.ko for KMI: ${{ inputs.kmi }} ==="

        CONFIG_KSU=m CC=clang make VER="${{ inputs.kmi }}"

        echo "=== Build completed ==="

        KO_DIR="out/${{ inputs.kmi }}"

        mkdir -p /github/workspace/out
        OUTPUT_NAME="${{ inputs.kmi }}_pathmask.ko"
        cp "$KO_DIR/pathmask.ko" "/github/workspace/out/$OUTPUT_NAME"

        echo "Copied to: /github/workspace/out/$OUTPUT_NAME"
        ls -la "/github/workspace/out/$OUTPUT_NAME"
        llvm-strip -d "/github/workspace/out/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "/github/workspace/out/$OUTPUT_NAME" | cut -f1)"

        # procguard.ko only exists on branches that add it to kernel/Makefile;
        # keep this conditional so main builds (without procguard) still pass.
        if [ -f "$KO_DIR/procguard.ko" ]; then
          cp "$KO_DIR/procguard.ko" "/github/workspace/out/${{ inputs.kmi }}_procguard.ko"
          llvm-strip -d "/github/workspace/out/${{ inputs.kmi }}_procguard.ko"
        fi

    - name: Upload PathMask artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.kmi }}-pathmask
        path: /github/workspace/out/*.ko
