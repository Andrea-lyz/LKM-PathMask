name: Issue 12 KallRecon test package (android14-6.1)

# Temporary validation workflow for the Pixel 8 / GKI 6.1 report in issue #12.
# Builds the pinned, fixed KallRecon revision and uploads a KernelSU test zip
# for the reporter. It publishes no Release and does not touch main.
on:
  push:
    branches: ['dev/kallrecon-ff73eae8']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-pathmask:
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: android14-6.1
      ddk_release: '20260828'

  package-test-zip:
    name: Package android14-6.1 test zip
    needs: build-pathmask
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: android14-6.1-pathmask
          path: ko
      - name: Package KernelSU test zip from the fixed build
        run: |
          cp ko/*.ko .
          NO_UPDATE_JSON=1 sh tools/package_ksu.sh android14-6.1_pathmask.ko out/issue12-test.zip
          echo "--- artifact hashes ---"
          sha256sum android14-6.1_pathmask.ko android14-6.1_procguard.ko out/issue12-test.zip
          echo "--- zip contents ---"
          unzip -l out/issue12-test.zip
      - uses: actions/upload-artifact@v7
        with:
          name: android14-6.1-kallrecon-ff73eae8-test
          path: |
            out/issue12-test.zip
            android14-6.1_pathmask.ko
            android14-6.1_procguard.ko
          retention-days: 90
